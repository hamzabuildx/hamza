<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mohd Hamza - Links</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,600,0,0" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #e8e8e8;
      font-family: 'Space Grotesk', sans-serif;
      color: #000000;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 48px 20px;
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .avatar-wrapper {
      position: relative;
      margin-bottom: 20px;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border: 3px solid #000000;
      border-radius: 8px;
      box-shadow: 6px 6px 0px #000000;
      object-fit: cover;
      display: block;
      background-color: #ffffff;
    }

    .name {
      font-size: 1.5rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .bio {
      font-size: 0.95rem;
      font-weight: 500;
      color: #333333;
      max-width: 320px;
      line-height: 1.4;
      margin-bottom: 28px;
    }

    .links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 36px;
    }

    .link-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 16px 20px;
      background-color: #ffffff;
      color: #000000;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border: 3px solid #000000;
      border-radius: 6px;
      box-shadow: 6px 6px 0px #000000;
      cursor: pointer;
      user-select: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
    }

    .link-button:hover {
      transform: translate(4px, 4px);
      box-shadow: 2px 2px 0px #000000;
      background-color: #fcfcfc;
    }

    .link-button:active {
      transform: translate(6px, 6px);
      box-shadow: 0px 0px 0px #000000;
    }

    .button-content {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .material-symbols-outlined {
      font-size: 22px;
      line-height: 1;
      display: inline-block;
    }

    .arrow-icon {
      font-size: 20px;
    }

    .footer {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #000000;
      padding: 6px 12px;
      border: 2px solid #000000;
      background-color: #ffffff;
      box-shadow: 3px 3px 0px #000000;
    }

    .footer .material-symbols-outlined {
      font-size: 16px;
    }
  </style>
</head>
<body>

  <main class="container">
    <div class="avatar-wrapper">
      <svg class="avatar" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="100" height="100" fill="#ffffff" />
        <circle cx="50" cy="38" r="20" fill="#000000" />
        <path d="M16 88C16 68 30 64 50 64C70 64 84 68 84 88" fill="#000000" />
      </svg>
    </div>

    <h1 class="name">Mohd Hamza</h1>
    <p class="bio">BCA Student & Web Developer</p>

    <div class="links-list">
      <!-- 1. Instagram -->
      <a href="https://www.instagram.com/origin.hamza/" class="link-button" target="_blank" rel="noopener">
        <div class="button-content">
          <span class="material-symbols-outlined">photo_camera</span>
          <span>Instagram</span>
        </div>
        <span class="material-symbols-outlined arrow-icon">arrow_forward</span>
      </a>

      <!-- 2. Telegram -->
      <a href="https://t.me/hamzawebdev" class="link-button" target="_blank" rel="noopener">
        <div class="button-content">
          <span class="material-symbols-outlined">send</span>
          <span>Telegram</span>
        </div>
        <span class="material-symbols-outlined arrow-icon">arrow_forward</span>
      </a>

      <!-- 3. GitHub -->
      <a href="https://github.com/hamzabuildx" class="link-button" target="_blank" rel="noopener">
        <div class="button-content">
          <span class="material-symbols-outlined">terminal</span>
          <span>GitHub</span>
        </div>
        <span class="material-symbols-outlined arrow-icon">arrow_forward</span>
      </a>

      <!-- 4. Email -->
      <a href="mailto:hamzabca2025@gmail.com" class="link-button">
        <div class="button-content">
          <span class="material-symbols-outlined">mail</span>
          <span>Email Me</span>
        </div>
        <span class="material-symbols-outlined arrow-icon">arrow_forward</span>
      </a>

      <!-- 5. Request a Call via Google Form -->
      <a href="https://forms.gle/vUvq2D8ygkS9HaCWA" class="link-button" target="_blank" rel="noopener">
        <div class="button-content">
          <span class="material-symbols-outlined">call</span>
          <span>Request a Call</span>
        </div>
        <span class="material-symbols-outlined arrow-icon">arrow_forward</span>
      </a>
    </div>

    <footer class="footer">
      <span class="material-symbols-outlined">location_on</span>
      <span>Bareilly, UP</span>
    </footer>
  </main>

</body>
</html>
